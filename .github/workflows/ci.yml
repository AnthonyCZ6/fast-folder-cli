# Pruebas en cada push a una rama y en cada pull request. release.yml también
# lo usa (workflow_call) antes de compilar, para no repetir los mismos pasos.
name: CI

on:
  push:
    branches:
      - "**"
      # Las ramas de Dependabot ya se prueban con su pull request; sin esto,
      # cada actualización se probaría dos veces.
      - "!dependabot/**"
  pull_request:
  workflow_call:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior. El tipo de
# evento forma parte del grupo para que una ejecución lanzada desde
# release.yml nunca cancele (ni sea cancelada por) la de un push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Si falla en un sistema, se termina en los demás: así se ve si el fallo
      # es de Windows, de Linux o de todos.
      fail-fast: false
      matrix:
        include:
          # Versión mínima declarada en go.mod.
          - os: windows-latest
            go: "1.26"
          - os: windows-latest
            go: stable
          # El detector de condiciones de carrera requiere cgo (gcc), incluido
          # en los runners de Linux.
          - os: ubuntu-latest
            go: stable
            race: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Comprobar formato (gofmt)
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Archivos sin el formato de gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Análisis estático (go vet)
        run: go vet ./...

      - name: Pruebas (go test)
        shell: bash
        run: go test ${{ matrix.race && '-race' || '' }} -count=1 -coverprofile=coverage.out ./... | tee go-test.txt

      # Cobertura de cada paquete y total, en el resumen de la ejecución.
      - name: Resumen de cobertura
        shell: bash
        run: |
          {
            echo "### Cobertura (${{ matrix.os }}, Go ${{ matrix.go }})"
            echo '```text'
            grep 'coverage:' go-test.txt |
              sed -E 's#^.*github\.com/AnthonyCZ6/fast-folder-cli([^[:space:]]*).*coverage: ([0-9.]+%).*#\2\t.\1#'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Cobertura mínima, solo en Windows: en Linux no se compila el código
      # propio de Windows (registro, Explorador...) y la cifra no es
      # comparable. No cuentan benchtree, que solo usan los benchmarks, ni
      # main.go, que solo llama a cli.Run.
      - name: Comprobar la cobertura mínima
        if: runner.os == 'Windows'
        shell: bash
        env:
          MIN_COVERAGE: 85
        run: |
          grep -v -e '/internal/benchtree/' -e 'fast-folder-cli/main\.go:' coverage.out > coverage-min.out
          total=$(go tool cover -func=coverage-min.out | tail -n 1 | awk '{print $NF}' | tr -d '%')
          # Sin "archivo.go:" en el mensaje: el detector de errores de Go que
          # instala setup-go lo tomaría por un error de compilación.
          echo "Cobertura total = ${total}% (mínimo ${MIN_COVERAGE}%, sin contar benchtree ni main)"
          echo "Cobertura total = **${total}%** (mínimo ${MIN_COVERAGE}%, sin contar benchtree ni main)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t < m) }'; then
            echo "::error::La cobertura (${total}%) es menor que el mínimo (${MIN_COVERAGE}%)"
            exit 1
          fi

  lint:
    name: Análisis adicional (staticcheck, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Instalar herramientas
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # El programa es para Windows: se analiza también con GOOS=windows para
      # incluir los archivos *_windows.go.
      - name: staticcheck
        run: |
          bin="$(go env GOPATH)/bin"
          "$bin/staticcheck" ./...
          GOOS=windows "$bin/staticcheck" ./...

      - name: govulncheck
        run: GOOS=windows "$(go env GOPATH)/bin/govulncheck" ./...
