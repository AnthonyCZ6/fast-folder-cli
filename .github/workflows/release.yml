# Publica una versión al subir una etiqueta semántica (v1.2.3, v1.3.0-rc.1...):
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# También puede ejecutarse a mano desde la pestaña Actions ("Run workflow"): en
# ese caso prueba y compila, deja los ejecutables como artefacto del workflow y
# NO publica nada.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Versión mínima declarada en go.mod.
          - os: windows-latest
            go: "1.23"
          - os: windows-latest
            go: stable
          # El detector de condiciones de carrera requiere cgo (gcc), incluido
          # en los runners de Linux.
          - os: ubuntu-latest
            go: stable
            race: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false # sin dependencias externas: no hay go.sum que cachear

      - name: Comprobar formato (gofmt)
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Archivos sin el formato de gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Análisis estático (go vet)
        run: go vet ./...

      - name: Pruebas (go test)
        shell: bash
        run: go test ${{ matrix.race && '-race' || '' }} -count=1 ./...

  build:
    name: Compilar ejecutables
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Compilar para Windows (amd64 y arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "Versión: $version"

          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "dist/fast-folder-cli-windows-$arch.exe" .
          done

          cd dist
          sha256sum *.exe > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: dist/
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial y etiquetas completos para el changelog

      - uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: dist

      - name: Generar notas de la versión
        run: |
          bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > notes.md
          cat notes.md

      - name: Crear release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Las etiquetas con sufijo (v1.2.0-rc.1) se publican como prerelease.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            kind=--prerelease
          else
            kind=--latest
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag "$kind" \
            --title "fast-folder-cli $GITHUB_REF_NAME" \
            --notes-file notes.md
