# Análisis de seguridad del código con CodeQL (code scanning de GitHub): en
# cada push a main, en cada pull request y una vez por semana. Los resultados
# aparecen en la pestaña Security. Se analiza en Windows para incluir el código
# propio de Windows (*_windows.go).
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analizar (Go)
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: go
          build-mode: autobuild

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
